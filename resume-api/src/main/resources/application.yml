prompt-service:
  url: ${PROMPT_SERVICE_URL:http://localhost:8001}

spring:
  application:
    name: resume-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resumepilot}
    username: ${SPRING_DATASOURCE_USERNAME:resumepilot}
    password: ${SPRING_DATASOURCE_PASSWORD:resumepilot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-random-string-at-least-256-bits-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}

ai:
  resume-ai-url: ${RESUME_AI_SERVICE_URL:${RESUME_AI_URL:http://localhost:8000}}
  rag-service-url: ${RAG_SERVICE_URL:http://localhost:8002}

cors:
  allowed-origins: ${RESUME_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

app:
  spa:
    enabled: false
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
  internal-api-token: ${INTERNAL_API_TOKEN:}
  ops-bot-token: ${OPS_BOT_TOKEN:}
  llm:
    encryption-key: ${LLM_ENCRYPTION_KEY:}
  certification:
    qnet:
      # 공공데이터포털에서 발급한 인증키. 비어 있으면 종목 조회는 비활성(텍스트 입력만 가능).
      enabled: ${QNET_LOOKUP_ENABLED:false}
      service-key: ${QNET_SERVICE_KEY:}
      base-url: ${QNET_BASE_URL:http://openapi.q-net.or.kr/api/service/rest/InquiryListNationalQualifcationSVC/getList}

auth:
  email-verification-bypass: ${AUTH_EMAIL_VERIFICATION_BYPASS:false}
  verification-token-ttl-hours: ${AUTH_VERIFICATION_TOKEN_TTL_HOURS:24}
  resend-cooldown-seconds: ${AUTH_RESEND_COOLDOWN_SECONDS:60}

mail:
  provider: ${MAIL_PROVIDER:log}
  from: ${MAIL_FROM:onboarding@resend.dev}

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
  kakao:
    client-id: ${KAKAO_OAUTH_CLIENT_ID:}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:}
    # false(기본): 로그인 화면에서 카카오 숨김. Admin 연동설정의 KAKAO_OAUTH_ENABLED=true 로도 켤 수 있음
    enabled: ${KAKAO_OAUTH_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.resumepilot: DEBUG
